name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: mvn -B -ntp dependency:tree -Dverbose
      - name: OWASP dependency scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B -ntp org.owasp:dependency-check-maven:check \
              -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7
          else
            echo "::warning::NVD_API_KEY is not configured; dependency scan skipped."
          fi
      - run: mvn -B -ntp -DskipTests package
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp test
