name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: mvn -B -ntp clean verify
      - run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mvn -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
          git add pom.xml '**/pom.xml'
          git commit -m "Release ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --generate-notes --title "Lambda Agent Core ${{ inputs.version }}"
